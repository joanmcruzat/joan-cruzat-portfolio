<app-nav (getInTouch)="hireOpen.set(true)" />

<main id="top">
  <app-hero (getInTouch)="hireOpen.set(true)" />
  <app-marquee />
  <app-work />
  <app-approach />
  <app-experience />
  <app-contact />
</main>

<app-footer />

<!-- Loaded on demand so the form code stays out of the initial bundle. -->
@if (hireOpen()) {
  @defer {
    <app-hire-modal [email]="site.email" (closed)="hireOpen.set(false)" />
  }
}

@defer (on idle) {
  <app-chat-widget [fullName]="site.fullName" [linkedinUrl]="site.linkedinUrl" />
}

<app-cursor />
