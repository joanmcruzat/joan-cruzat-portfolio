<app-nav [fullName]="profile()?.fullName ?? ''" (getInTouch)="openHire('nav')" />

<main id="top">
  @if (content(); as content) {
    <app-hero [profile]="content.profile" (getInTouch)="openHire('hero')" />
    <app-marquee [items]="content.profile.marquee" />
    <app-work [copy]="content.sections.work" [projects]="content.projects" />
    <app-approach [copy]="content.sections.approach" [principles]="content.principles" />
    <app-experience
      [copy]="content.sections.experience"
      [years]="content.profile.yearsExperience"
      [jobs]="content.experience"
      [stack]="content.stack"
    />
    <app-contact [copy]="content.sections.contact" [profile]="content.profile" />
  } @else {
    <app-content-status class="wrap" [hasError]="hasError()" (retry)="reload()" />
  }
</main>

@if (profile(); as profile) {
  <app-footer [fullName]="profile.fullName" [visitors]="visitors()" />

  <!-- Loaded on demand so the form code stays out of the initial bundle. -->
  @if (hireOpen()) {
    @defer {
      <app-hire-modal [email]="profile.email" (closed)="hireOpen.set(false)" />
    }
  }

  @defer (on idle) {
    <app-chat-widget [fullName]="profile.fullName" [linkedinUrl]="profile.linkedinUrl" />
  }
}

<app-cursor />
